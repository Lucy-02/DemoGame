<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
    <title>정령 덱빌더 전투 프로토타입</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14121c; }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

      /* 개발용 창 틀: 브라우저(dev:web)에서만 켜져요(body.dev-window). 게임 UI가 아니라 보기 편하게 하는 틀이에요. */
      #dev-window { display: contents; }
      .dev-titlebar, #dev-closed { display: none; }
      body.dev-window { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
      body.dev-window #dev-window { display: flex; flex-direction: column; border: 1px solid #3a3646; border-radius: 8px; overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
      body.dev-window #game { width: auto; height: auto; display: block; line-height: 0; }
      body.dev-window .dev-titlebar { display: flex; align-items: center; height: 32px; padding-left: 12px; background: #24212e; color: #b8b3c6; font-size: 12px; user-select: none; }
      .dev-titlebar .dev-title { flex: 1; }
      .dev-titlebar button { width: 46px; height: 32px; border: 0; background: none; color: inherit; font: inherit; font-size: 14px; cursor: pointer; }
      .dev-titlebar button:hover { background: #34303f; }
      .dev-titlebar button[data-dev="close"]:hover { background: #c42b1c; color: #fff; }
      body.dev-window.dev-closed #dev-window { display: none; }
      body.dev-window.dev-closed #dev-closed { display: block; color: #b8b3c6; font-size: 14px; }
      #dev-closed button { margin-left: 8px; font: inherit; cursor: pointer; }
      /* 전체 화면에서는 틀 없이 게임만 */
      body.dev-window:fullscreen .dev-titlebar, :fullscreen body.dev-window .dev-titlebar { display: none; }
      :fullscreen body.dev-window #dev-window { border: 0; border-radius: 0; box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="dev-window">
      <div class="dev-titlebar">
        <span class="dev-title">정령 덱빌더 · 개발용 창 1280×800</span>
        <button data-dev="fullscreen" title="전체 화면">□</button>
        <button data-dev="close" title="창 닫기">✕</button>
      </div>
      <div id="game"></div>
    </div>
    <div id="dev-closed">창을 닫았어요.<button data-dev="reopen">다시 열기</button></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
