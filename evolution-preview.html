<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>진화 연출 미리보기</title>
    <!-- 개발 도구 페이지 (pnpm dev:web → /evolution-preview.html). 게임 빌드에는 들어가지 않아요. 연출 시안이라 화면 값은 모두 임시예요. -->
    <style>
      html, body { margin: 0; height: 100%; background: #141214; color: #ddd; font: 13px/1.4 system-ui, "Pretendard", sans-serif; }
      #bar { position: fixed; left: 8px; top: 6px; display: flex; gap: 8px; align-items: center; z-index: 1; flex-wrap: wrap; }
      select, button { background: #2b2730; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 3px 8px; font: inherit; }
      #hud { opacity: 0.75; }
      #stage { display: flex; justify-content: center; align-items: center; height: 100%; }
      #stage canvas { max-width: 100vw; max-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="bar">
      <select id="spirit"></select>
      <select id="branch"></select>
      <button id="play">처음부터</button>
      <button id="prev">◀</button>
      <button id="next">▶</button>
      <button id="skip">건너뛰기</button>
      <label><input type="checkbox" id="still" /> 동작 줄이기</label>
      <span id="hud"></span>
    </div>
    <div id="stage"></div>
    <script type="module" src="/tools/evolution-preview/main.ts"></script>
  </body>
</html>
