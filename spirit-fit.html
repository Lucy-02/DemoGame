<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>정령 피팅</title>
    <!-- 개발 도구 페이지 (pnpm dev:web → /spirit-fit.html). 게임 빌드에는 들어가지 않아요. 결정 0023 -->
    <style>
      :root { --bg: #17151d; --panel: #211e29; --line: #34303f; --ink: #ece8f3; --ink2: #a9a3b8; --acc: #c9a4ff; --ok: #8fd18f; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, "Pretendard", sans-serif; }
      #app { display: grid; grid-template-columns: 250px 1fr 320px; height: 100%; }
      aside, #controls { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); }
      #controls { border-right: 0; border-left: 1px solid var(--line); padding: 14px 16px; }
      main { display: flex; flex-direction: column; min-width: 0; }
      .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .bar .grow { flex: 1; }
      button, select, input[type=number] { background: #2b2735; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: var(--ink2); }
      button.on { border-color: var(--acc); color: var(--acc); }
      button.primary { background: var(--acc); color: #1a1625; border-color: var(--acc); font-weight: 600; }
      #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 0; overflow: auto; }
      #view { width: 100%; max-width: 1280px; aspect-ratio: 16 / 10; cursor: grab; border-radius: 6px; box-shadow: 0 8px 30px #0008; }
      #view.drag { cursor: grabbing; }
      #grid { display: none; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; padding: 12px; overflow-y: auto; }
      #grid figure { margin: 0; cursor: pointer; }
      #grid canvas { width: 100%; border-radius: 4px; display: block; border: 2px solid transparent; }
      #grid figure.sel canvas { border-color: var(--acc); }
      #grid figcaption { color: var(--ink2); padding: 3px 2px; }
      body.grid #stage { display: none; } body.grid #grid { display: grid; }
      .row { display: flex; align-items: center; gap: 6px; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid #ffffff08; }
      .row .name { flex: 1; }
      .row img { width: 46px; height: 46px; object-fit: contain; border-radius: 6px; background: #ffffff08; border: 2px solid transparent; }
      .row img.sel { border-color: var(--acc); }
      .row img.edited { box-shadow: 0 0 0 1px var(--ok) inset; }
      h2 { font-size: 16px; margin: 0 0 4px; } h3 { font-size: 12px; color: var(--ink2); margin: 18px 0 6px; font-weight: 600; }
      .stages { display: flex; gap: 4px; margin: 6px 0; }
      label.slider { display: grid; grid-template-columns: 52px 1fr 64px; gap: 6px; align-items: center; margin: 5px 0; color: var(--ink2); }
      label.slider input[type=number] { width: 64px; padding: 2px 4px; }
      label.check { display: flex; gap: 6px; align-items: center; color: var(--ink2); }
      .faces { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
      .faces canvas { border-radius: 50%; background: #2b2735; }
      #crop { width: 100%; background: #0003; border-radius: 6px; cursor: grab; display: block; }
      .hint { color: var(--ink2); font-size: 12px; margin: 4px 0; }
      #status { color: var(--ink2); } #status.dirty { color: var(--acc); } #status.saved { color: var(--ok); }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="list"></aside>
      <main>
        <div class="bar">
          <button id="tab-edit" class="on">한 장씩</button>
          <button id="tab-grid">나란히 보기</button>
          <span class="grow"></span>
          <label class="check"><input type="checkbox" id="opt-closed" /> 패널 접힘</label>
          <label class="check"><input type="checkbox" id="opt-guide" checked /> 안내선</label>
          <label class="check"><input type="checkbox" id="opt-ui" checked /> UI 자리</label>
          <span id="status"></span>
          <button id="save" class="primary">저장 (Ctrl+S)</button>
        </div>
        <div id="stage"><canvas id="view" width="1280" height="800"></canvas></div>
        <div id="grid"></div>
      </main>
      <section id="controls"></section>
    </div>
    <script type="module" src="/tools/spirit-fit/main.ts"></script>
  </body>
</html>
