name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:deps
      - run: pnpm test
      - run: pnpm check:design
      - run: pnpm check:docs
      - run: pnpm check:assets
      - name: Electron smoke test
        run: xvfb-run -a pnpm test:e2e

  # 화면으로 한 판을 도는 점검. 크로미움 설치와 실행이 길어서 따로 돌려요
  screen-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screen-run-results
          path: test-results/

  # 주 대상인 윈도에서 데모 패키지를 만들고, 그 실행 파일로 스모크와 성능 기록을 돌려요 (0139)
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:demo
      # 러너의 기본 화면(1024×768)에는 기준 창(1280×800)이 안 들어가서 윈도가 창을 줄여요. 스모크가 기준 크기를 보려면 화면이 더 커야 해요
      - name: Set display to 1920x1080
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Packaged smoke test
        run: pnpm exec playwright test
        env:
          DEMOGAME_EXE: release/demo/win-unpacked/demogame.exe
          DEMOGAME_SOFTWARE_GL: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-results
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: demo-win-unpacked
          path: release/demo/win-unpacked/
          retention-days: 7
